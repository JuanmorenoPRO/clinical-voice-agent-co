[pytest]
pythonpath = .
testpaths = app/tests
markers =
    juicio_del_modelo: sondas de calibración que dependen del criterio del LLM en
        vivo, no del contrato del adaptador. No corren por defecto porque un 70B
        cambia de opinión entre ejecuciones y un test rojo intermitente no dice
        nada. Se activan con TEST_JUICIO_MODELO=1.
