; Configuración de pytest para el framework de evaluación (raíz del repo).
;
; Coexiste con apps/backend/pytest.ini: aquel corre las pruebas del backend
; (app/tests) ejecutando pytest DESDE apps/backend; este corre el framework de
; evaluación ejecutando pytest DESDE la raíz del repo.
[pytest]
testpaths = tests
pythonpath = . apps/backend
markers =
    integration: pruebas que requieren PostgreSQL+pgvector y (opcional) API keys.
